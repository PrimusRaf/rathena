Header:
  Type: COMBO_DB
  Version: 1

# ==========================================================
#  SafaRO - Set-Boni der Farming-Ausruestung
#
#  Die acht Einzelteile geben je +50 %, zusammen also +400 %.
#  Ist das Set vollstaendig, kommen hier noch einmal +400 %
#  dazu - der Wert verdoppelt sich damit auf +800 %.
#
#  Das Sigil steht ZWEIMAL in der Liste. pc_checkcombo in
#  src/map/pc.cpp merkt sich zu jedem Eintrag den Inventarplatz
#  und ueberspringt bereits verwendete; eine doppelt genannte Id
#  verlangt deshalb wirklich zwei getragene Stuecke und nicht
#  zweimal dasselbe.
# ==========================================================

# ==========================================================
#  +++ DIE 400 STEHT DOPPELT +++
# ----------------------------------------------------------
#  Die beiden Aufsaetze der Farming-Sets - Schattenwaffe und
#  Schattenschild - VERDOPPELN den laufenden Set-Bonus. Sie
#  muessen ihn dafuer kennen und rechnen ihn selbst nach, in
#  npc/custom/safa_farmsets.txt (F_SafaFarmSet).
#
#  Diese Funktion enthaelt dieselben 400 noch einmal. Wer sie
#  hier aendert, aendert sie dort mit. Sonst verdoppeln die
#  Aufsaetze auf einen anderen Wert als den, der tatsaechlich
#  anliegt - und im Spiel sieht man nur eine Zahl, die nicht
#  stimmt.
#
#  Ueber eine Kombination waeren die Aufsaetze nicht zu
#  bauen: eine Kombination addiert einen FESTEN Betrag und
#  kennt den laufenden Bonus nicht. Die Begruendung im
#  Einzelnen steht im Kopf von safa_farmsets.txt.
# ==========================================================

Body:
  - Combos:
      - Combo:
          - Scholars_Beret
          - Scholars_Lens
          - Scholars_Charm
          - Scholars_Robe
          - Scholars_Mantle
          - Scholars_Boots
          - Scholars_Sigil
          - Scholars_Sigil    # zweites Accessoire, linke Hand
    Script: |
      bonus2 bExpAddRace,RC_All,400;

  - Combos:
      - Combo:
          - Prospectors_Beret
          - Prospectors_Lens
          - Prospectors_Charm
          - Prospectors_Robe
          - Prospectors_Mantle
          - Prospectors_Boots
          - Prospectors_Sigil
          - Prospectors_Sigil    # zweites Accessoire, linke Hand
    Script: |
      bonus2 bDropAddRace,RC_All,400;





