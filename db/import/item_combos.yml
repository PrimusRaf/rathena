###########################################################################
#
# Settings
#
###########################################################################
# - Combos:                 List of combo sets.
#    - Combo:               Sequence of items to define a combo (minimum of 2 items).
#       - <item name>       AEGIS name of the item
#   Script                  Script to execute when one of the combos is equipped. (Default: null)
#   Clear                   Remove the defined combos from database. (Default: false)
###########################################################################

Header:
  Type: COMBO_DB
  Version: 1

# ==========================================================
#  SafaRO - Set-Boni der Farming-Ausruestung
#
#  Die acht Einzelteile geben je +50 %, zusammen also +400 %.
#  Ist das Set vollstaendig, kommen hier noch einmal +400 %
#  dazu - der Wert verdoppelt sich damit auf +800 %.
#
#  Das Sigil steht ZWEIMAL in der Liste. pc_checkcombo in
#  src/map/pc.cpp merkt sich zu jedem Eintrag den Inventarplatz
#  und ueberspringt bereits verwendete; eine doppelt genannte Id
#  verlangt deshalb wirklich zwei getragene Stuecke und nicht
#  zweimal dasselbe.
# ==========================================================

Body:
  - Combos:
      - Combo:
          - Scholars_Beret
          - Scholars_Lens
          - Scholars_Charm
          - Scholars_Robe
          - Scholars_Mantle
          - Scholars_Boots
          - Scholars_Sigil
          - Scholars_Sigil    # zweites Accessoire, linke Hand
    Script: |
      bonus2 bExpAddRace,RC_All,400;

  - Combos:
      - Combo:
          - Prospectors_Beret
          - Prospectors_Lens
          - Prospectors_Charm
          - Prospectors_Robe
          - Prospectors_Mantle
          - Prospectors_Boots
          - Prospectors_Sigil
          - Prospectors_Sigil    # zweites Accessoire, linke Hand
    Script: |
      bonus2 bDropAddRace,RC_All,400;





