# --------------------------------------------------------------------
#  WARUM bSpeedRate UND NICHT bSpeedAddRate
#
#  Beide machen schneller - das Vorzeichen wird in pc.cpp:3964 beim
#  Setzen umgedreht, ein positives n im Skript ist also richtig.
#  Der Unterschied liegt im Zusammenspiel:
#
#    bSpeedAddRate   stapelt (pc.cpp:3968, "-=")
#    bSpeedRate      stapelt NICHT (pc.cpp:3966, "min")
#
#  Gestapelt koennte ein Startgeschenk spaeter mit richtiger
#  Ausruestung zusammenlaufen und Richtung Untergrenze druecken
#  (status.cpp:8230 kappt bei 40). Mit bSpeedRate gewinnt schlicht der
#  groesste Einzelwert, der Rucksack wird also spaeter still
#  ueberholt statt aufzuaddieren. Das ist auch, was die amtlichen
#  Stuecke tun: 67 Items nutzen bSpeedRate, kein einziges
#  bSpeedAddRate.
#
#  ZU ERWARTEN IST WENIGER, ALS DIE ZAHL VERSPRICHT
#  status.cpp:8224 nimmt das Maximum aus allen Beschleunigern, nicht
#  die Summe. Solange Increase Agi laeuft (25 %), sind die 10 % hier
#  wirkungslos. Sie zaehlen fuer alle, die gerade keinen Agi-Puffer
#  haben - also genau am Anfang.
# --------------------------------------------------------------------

  - Id: 30503
    AegisName: Safa_Traveler_Pack
    Name: Traveler's Backpack
    Type: Armor
    Buy: 0
    Weight: 200
    Defense: 10
    Slots: 4
    Locations:
