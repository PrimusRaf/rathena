# ###########################################################################
# SafaRO - eigene Items
# ###########################################################################
#
# ID-Bereich 30000+ ist in keiner offiziellen Datenbank belegt (geprueft
# gegen item_db_equip/etc/usable, 29.356 Eintraege - keine Kollision).
#
#   30000        Destiny Ore    Material des Ironhand ab +11
#   30001        Destiny Coin   Waehrung, faellt von Monstern
#   30010-30012  Kopf oben      Custom Merchant, 500 / 750 / 1000 Coins
#   30020-30022  Kopf mitte     Custom Merchant, 500 / 750 / 1000 Coins
#   30030-30032  Kopf unten     Custom Merchant, 500 / 750 / 1000 Coins
#
# Zu View: 2812-2820 sind eigene Nummern, direkt oberhalb der hoechsten
# offiziellen (2811). Weiter oben angesiedelte Nummern hat der Client
# nicht angenommen - 2812 dagegen schon, im Spiel nachgewiesen. Die zugehoerigen Sprites liegen lose
# unter client/data/sprite/, die Zuordnung Nummer -> Sprite steht in
# client/data/luafiles514/lua files/datainfo/accname.lub.
#
# Die drei Preisstufen bauen aufeinander auf:
#   500  Coins  -  +5 auf alles, kleiner Zusatz je Slot
#   750  Coins  -  +8, dazu 5 % Schaden und 10 % HP/SP
#   1000 Coins  -  +12, dazu 10 % Schaden, 15 % HP/SP, Trait-Stats
#
# Alle drei Slots sind getrennt, man kann also oben, mitte und unten
# gleichzeitig tragen. Refineable, damit der Ironhand sie annimmt.
# ###########################################################################

Body:
  - Id: 30000
    AegisName: Destiny_Ore
    Name: Destiny Ore
    Type: Etc
    Buy: 0
    Sell: 0
    Weight: 10
    Flags:
      BuyingStore: false
      DeadBranch: false
      NoConsume: false

  - Id: 30001
    AegisName: Destiny_Coin
    Name: Destiny Coin
    Type: Etc
    Buy: 0
    Sell: 0
    Weight: 1
    Flags:
      BuyingStore: false
      DeadBranch: false
      NoConsume: false
    # Nicht an NPC-Haendler verkaufbar.
    #
    # "Sell: 0" allein reicht dafuer NICHT - im Gegenteil, es ist die
    # schlimmere Variante: der Gegenstand steht im Verkaufsfenster,
    # laesst sich anklicken und bringt null Zeny. Wer beim Aufraeumen
    # alles markiert, ist seine Coins los und hat nichts dafuer.
    #
    # NoSell greift eine Stufe frueher. clif.cpp:2291 filtert beim
    # AUFBAU der Verkaufsliste - die Coins tauchen dort gar nicht erst
    # auf, es gibt also nichts zum Verklicken. npc.cpp:3073 prueft
    # zusaetzlich serverseitig, falls jemand das Paket selbst baut.
    #
    # Bewusst NUR NoSell: Handel zwischen Spielern, Lager und Post
    # bleiben offen. Eine Zweitwaehrung, die man nicht weitergeben
    # kann, ist keine Waehrung.
    #
    # Override bleibt auf dem Standard 100 - Spielleiter ab Stufe 100
    # koennen die Sperre umgehen, was fuer Tests gelegen kommt.
    Trade:
      NoSell: true

