# ============================================================
#  Pfeile: gewichtslos
# ------------------------------------------------------------
#  Ein Bogenschuetze schleppt Munition, alle anderen nicht. Bei
#  0,1 Gewicht je Pfeil sind 3.000 Stueck - eine normale
#  Abendration - 300 Gewicht. Das ist bei den meisten Klassen
#  mehr als die gesamte Ausruestung wiegt.
#
#  Der Handkarren behebt das nicht: aus dem Karren laesst sich
#  nicht schiessen, die Pfeile muessen ins Inventar.
#
#  Betrifft NUR Type: Ammo, SubType: Arrow. Kugeln, Kunai,
#  Shuriken, Kanonenkugeln und Wurfwaffen behalten ihr Gewicht -
#  siehe die Notiz am Ende dieses Blocks.
#
#  Ein Import-Eintrag braucht nur die Felder, die sich aendern:
#  existiert die Id bereits, sind AegisName und Name optional
#  (itemdb.cpp:58). Alles andere - Angriff, Element, Skript -
#  bleibt unberuehrt.
#
#  IDTest_arrow (1200000) ist bewusst NICHT dabei, das ist ein
#  Testgegenstand von rAthena.
#
#  Erzeugt aus db/re/item_db_etc.yml am 2026-08-19.
