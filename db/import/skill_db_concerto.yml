# SafaRO - Concerto-Skills der Barden/Taenzer (CONCERTO.md)
#
# Quest-freigeschaltete Skills, eine Stufe, kein Skilltree (Etc-Tab
# ueber "skill <id>,1,0"). Beim Wirken laeuft ein ganzes Musikstueck bei
# allen Spielern im Umkreis; Duration1 IST die Liedlaenge und kommt aus
# tools/concerto/beatmap.py (Kopfzeile dauer_ms der .beats-Datei).
# Code: src/map/skills/custom/concerto.cpp.
#
# Unit: die Unit-Id bestimmt nur die ANZEIGE im Client (fest in der
# EXE). Dissonance zeichnet der 2025er Client gar nicht (12.09.).
# Severe_Rainstorm sah gut aus, bringt aber einen eigenen Client-Sound mit
# (12.09., verworfen). Volcano: Layout 5 = 11x11, jede Zelle zeigt das
# Flammenbild, kein Sound. Die Betreten-/Tick-Logik fremder Unit-Ids ist
# fuer Concertos in skill.cpp abgeschaltet (concerto_ist_skill), es wird
# nur das Bild geliehen. Interval -1 = keine Server-Ticks; der Schaden
# kommt spaeter ueber die Beat-Map-Timer. Die Flaeche folgt dem Barden
# (concerto_mitziehen in map_moveblock).
#
# Alternativen zum Ausprobieren (nur Unit-Id/Layout tauschen, dann
# @reloadskilldb): Deluge, Violent_Gale (gleiche Bauart), Land_Protector
# (graue Kacheln), Sanctuary (goldene Kacheln, Layout 3), Warmer (7x7
# Glut, Layout 3), Psychic_Wave (Range 5, blaue Wellen, einzelne Unit).
#
# TargetType Self: die Flaeche entsteht um den Barden herum, wie bei den
# Originalsongs (Raffael 12.09.) - kein Zielkreuz auf dem Boden.
#
# Stand 12.09.2026: Flaeche + Musik + Hoersperre, noch KEIN Schaden.

