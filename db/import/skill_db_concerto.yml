# SafaRO - Concerto-Skills der Barden/Taenzer (CONCERTO.md)
#
# Quest-freigeschaltete Skills, eine Stufe, kein Skilltree (Etc-Tab
# ueber "skill <id>,1,0"). Beim Wirken laeuft ein ganzes Musikstueck bei
# allen Spielern im Umkreis; Duration1 IST die Liedlaenge und kommt aus
# tools/concerto/beatmap.py (Kopfzeile dauer_ms der .beats-Datei).
# Code: src/map/skills/custom/concerto.cpp.
#
# Unit: Dissonance nur fuer die Anzeige im Client (feste Unit-Ids in
# der EXE); RangedSingleUnit zeigt nur die Mittelzelle. Layout 6 =
# 13x13. Interval -1 = keine Server-Ticks - der Schaden kommt spaeter
# ueber die Beat-Map-Timer, nicht ueber den Unit-Tick.
#
# TargetType Self: die Flaeche entsteht um den Barden herum, wie bei den
# Originalsongs (Raffael 12.09.) - kein Zielkreuz auf dem Boden.
#
# Stand 12.09.2026: Flaeche + Musik + Hoersperre, noch KEIN Schaden.

