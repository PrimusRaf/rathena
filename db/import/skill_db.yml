###########################################################################
# SafaRO - Handgepflegte Skill-Anpassungen
###########################################################################
#
#  NICHT zu verwechseln mit db/import/skill_db_cooldowns.yml - die wird
#  von tools/cooldowns/bauen.py erzeugt und setzt nur Cooldowns. Diese
#  Datei hier wird von Hand gepflegt.
#
# --------------------------------------------------------------------
#  TREFFERZAHLEN DER SCHWACHEN KLASSEN (04.09.2026)
# --------------------------------------------------------------------
#
#  WARUM TREFFERZAHLEN UND NICHT RATIOS
#
#  Die Auswertung aller 511 Ratio-Funktionen (BALANCE-ANALYSE.md) hat
#  gezeigt: die Rangfolge der Klassen haengt fast nur an HitCount, nicht
#  an der Ratio-Hoehe. Der Dragon Knight hat mit 38.500 das staerkste
#  Einzelratio des Spiels und lag trotzdem bei 30 Prozent - weil
#  DK_DRAGONIC_AURA einmal trifft. Der Meister fuehrt mit dem
#  kleineren Ratio und sieben Treffern.
#
#  Deshalb wird hier an HitCount gedreht. Das hat drei Vorteile: es ist
#  eine Zahl je Fertigkeit statt einer Formel, es braucht keinen
#  Rebuild, und es laesst die Ratios unangetastet - wer sie spaeter
#  gegen rAthena vergleicht, findet sie unveraendert vor.
#
#  DAS VORZEICHEN IST DER GANZE TRICK
#
#  battle.cpp:4340
#      #define DAMAGE_DIV_FIX(dmg, div) \
#          { if ((div) < 0) { (div) *= -1; (dmg) /= (div); } (dmg) *= (div); }
#
#  Negativ heisst: erst teilen, dann malnehmen - der GESAMTSCHADEN
#  bleibt gleich, es sieht nur nach mehreren Treffern aus. Positiv
#  heisst: mal Trefferzahl, also echter Schaden.
#
#  Mehrere der schwachen Fertigkeiten standen auf negativ und sahen
#  dadurch staerker aus, als sie waren (SS_FUUMAKOUCHIKU -3,
#  HN_JUPITEL_THUNDER_STORM -10, WH_WILD_WALK -3 ...). Sie stehen jetzt
#  auf positiv, mit einer Zahl, die den Schaden auf rund 55 Prozent des
#  Meisters bringt.
#
#  SICHTBARE FOLGE: Wo eine negative Zahl kleiner wird (etwa -10 auf
#  +4), zeigt der Client kuenftig weniger Einzeltreffer. Der Schaden
#  steigt trotzdem - der Client zaehlt Treffer, nicht Wirkung.
#
#  Nicht angefasst sind Meister (100 %), Elemental Master (90 %),
#  Troubadour (76 %) und Soul Ascetic (50 %) - die stehen schon im Feld.
#
#  Zum Nachrechnen: BALANCE-ANALYSE.md im Wurzelverzeichnis.
###########################################################################

