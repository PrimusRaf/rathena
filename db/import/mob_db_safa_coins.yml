# ###########################################################################
# SafaRO - Destiny Coin bei allen Monstern
# ###########################################################################
#
# Diese Datei ist GENERIERT. Nicht von Hand pflegen.
#
# Inhalt: fuer jedes normale Monster ein zusaetzlicher Drop-Eintrag
#   Item: Destiny_Coin   Rate: 1000   (= 10,00 Prozent)
#
# WICHTIG - warum aus den 10 Prozent nicht 100 werden:
# Der Server multipliziert jede Drop-Rate mit item_rate_common, bei uns
# 2500 also 25x. 1000 * 25 waere 250 Prozent und wuerde auf 100 gedeckelt.
# Deshalb steht Destiny_Coin in db/import/mob_item_ratio.yml mit Ratio 100.
# Das ersetzt den Multiplikator fuer genau dieses Item, die Rate bleibt
# unveraendert bei 1000 von 10000.
#
# NICHT enthalten:
#   - MVPs. Die geben 5 Coins garantiert, das erledigt das Kill-Event in
#     npc/custom/safa_shops.txt.
#   - Truhen, Emperium, Barrikaden und WoE-Objekte.
#
# Der Eintrag wird ohne Index angehaengt und landet damit hinter den
# vorhandenen Drops. Das hoechste Vorkommen sind 8 Drops, das Limit von
# 10 (MAX_MOB_DROP) wird also nirgends erreicht.
#
# Generiert am 2026-08-16 fuer 2411 Monster.
# ###########################################################################

