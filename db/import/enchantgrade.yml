###########################################################################
# Enchantgrade Database
###########################################################################
#
# Enchantgrade Settings
#
###########################################################################
# - Type                                Item type.
#   Levels:                             Enchantgrade settings per item level.
#     - Level                           Item level.
#       Grades:                         Enchantgrade settings per grade level.
#         - Grade                       Enchantgrade level.
#           Chances:                    Chance settings per refine level.
#             - Refine                  Refine level.
#               Chance                  Base chance of success out of 0~10000.
#           Bonus                       Enchantgrade bonus. (Default: 0)
#           AnnounceSuccess             Announce on upgrade success. (Default: true)
#           AnnounceFail                Announce on upgrade failure. (Default: false)
#           Announce                    Announce on upgrade success and failure.
#           Catalyst:                   Catalyst item to increase chance of success.
#             Item                      The item that can be used.
#             AmountPerStep             Amount of Item needed.
#                                       Set to 0 to disable the catalyst.
#             MaximumSteps              Maximum amount of times Item can be used.
#             ChanceIncrease            Amount at which the chance increases for each Item used.
#           Options:                    Success chance based on cost type.
#             - Option                  Index of the client option.
#               Item                    Required item.
#               Amount                  Amount of required item. (Default: 1)
#                                       Set to 0 to remove an option.
#               Zeny                    Amount of zeny required. (Default: 0)
#               BreakingRate            Chance of item breaking out of 0~10000. (Default: 0)
#               DowngradeAmount         Number of refine levels reduced on failure. (Default: 0)
###########################################################################

Header:
  Type: ENCHANTGRADE_DB
  Version: 3

###########################################################################
#  Verfeinerung 21 bis 30
###########################################################################
#
#  rAthenas Tabelle endet bei +20. Unser MAX_REFINE steht auf 30
#  (src/map/status.hpp:37, von uns gesetzt), und was dazwischen liegt,
#  war eine Luecke mit harten Folgen.
#
#  WAS PASSIERT IST
#
#  s_enchantgradelevel::chances ist ein Array der Groesse
#  MAX_REFINE + 1, beim Anlegen mit Nullen gefuellt
#  (status.cpp:676). Nur die in der YAML genannten Stufen bekommen
#  einen Wert - 21 bis 30 blieben also auf 0.
#
#  Und clif.cpp:24126 bricht bei einer Null kommentarlos ab:
#
#      uint16 totalChance = enchantgradelevel->chances[refine];
#      if( totalChance == 0 ){
#          return;
#      }
#
#  Ein Stueck ueber +20 liess sich damit GAR NICHT graden. Der Client
#  schickte, der Server verwarf, und der Spieler bekam nicht einmal
#  eine Meldung. Weiter zu verfeinern hat das Graden also nicht
#  verbessert, sondern ausgeschlossen.
#
#  WAS HIER STEHT
#
#  Die Chance von +20 wird bis +30 fortgeschrieben. Die amtliche
#  Kurve laeuft ohnehin in eine Ebene - 10, 20, dann 70 ab +11 und
#  80 ab +16 - und eine Ebene fortzusetzen ist die einzige
#  Verlaengerung, die keine Balancefrage aufmacht. Wer die oberen
#  Stufen belohnen will, dreht hier an zehn Zahlen.
#
#  Der Import ist ein FLICKEN, kein Ersatz: EnchantgradeDatabase
#  ::parseBodyNode sucht Typ, Stufe und Grade ueber find() und
#  map_find() und ueberschreibt nur, was hier steht. Optionen,
#  Katalysator und Bonus bleiben unangetastet - deshalb fehlen sie
#  unten auch.
#
###########################################################################

Body:
  - Type: Armor
    Levels:
      - Level: 2
        Grades:
          - Grade: None
            Chances:
              - Refine: 21
