# ==========================================================
#  SafaRO - Zaehmen gelingt immer
# ==========================================================
#  ERZEUGT von tools/pets/bauen.py - nicht von Hand pflegen.
#
#  Wer ein Zaehmitem benutzt, soll das Tier bekommen. Die Sammlerei
#  besteht dann darin, das Item und das Tier zu finden, nicht darin,
#  denselben Versuch zwanzigmal zu wiederholen.
#
#  CaptureRate 10000 und nicht der Multiplikator pet_catch_rate:
#  dessen Rechnung in pet.cpp:1339 multipliziert vor der Division in
#  einem int32 und laeuft bei grossen Faktoren ueber. Eine negative
#  Zahl laesst rnd_chance immer fehlschlagen - der Fang waere dann
#  unmoeglich statt sicher.
#
#  Aufgenommen sind nur Tiere mit einem Zaehmitem. Wer keines hat,
#  ist nicht zum Fangen gedacht und bleibt, wie er ist.
# ==========================================================

Header:
  Type: PET_DB
  Version: 1

Body:
  - Mob: ALICE
    CaptureRate: 10000
    AllowAutoFeed: true
    Script: |
      .@f = getpetinfo(PETINFO_INTIMATE);
      .@s = .@f / 100;
      bonus bAllStats, 3 * .@s;
      bonus bMaxHPrate, .@s;
      bonus bMaxSPrate, .@s;
      if (.@f >= PET_INTIMATE_LOYAL) {
        bonus3 bAutoSpell,"MG_SOULSTRIKE",10,100;
        bonus3 bAutoSpellWhenHit,"PR_KYRIE",10,50;
      }
