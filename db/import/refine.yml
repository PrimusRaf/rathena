# SafaRO - Refine sicher bis +10
#
# Bewusst minimal: nur Type und Rate. Alles andere (Preis, Material,
# Bruchrate) bleibt so, wie es in db/re/refine.yml steht - der Parser
# mischt pro Eintrag ein und laesst nicht angegebene Felder unberuehrt.
#
# Warum nicht "BreakingRate: 0"? Weil der Parser Raten von 0 ablehnt:
# asUInt16Rate() meldet "needs to be at least 1" und verwirft daraufhin
# die KOMPLETTE Gruppe. Genau daran ist die erste Fassung gescheitert.
# Noetig ist die Null ohnehin nicht - bei 100 % Erfolg kommt es nie zu
# einem Fehlschlag, also auch nie zum Bruch.

