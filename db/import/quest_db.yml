###########################################################################
# Quest Database
###########################################################################
#
# Quest Settings
#
###########################################################################
# - Id                     Quest ID.
#   Title                  Quest title.
#   TimeLimit              Amount of time before the quest expires. (Default: 0)
#   Targets:               Quest objective target. (Default: null)
#     - Mob                Name of monster to kill.
#       Count              Amount of monsters to kill. Set to 0 to skip the target on import.
#       Id                 Unique target index for the quest Id. Requires a positive number.
#       Race               Monster race target. (Default: All)
#       Size               Monster size target. (Default: All)
#       Element            Monster element target. (Default: All)
#       MinLevel           Minimum monster level target. If not supplied but MaxLevel defined, MinLevel is 1. Set to 0 to ignore MinLevel on import. (Default: 0)
#       MaxLevel           Maximum monster level target. Set to 0 to ignore MaxLevel on import. (Default: 0)
#       Location           Map name where kills are counted. (Default: All)
#       MapName            Displayed map name in quest UI. (Default: empty string)
#       MapMobTargets      List of monster names. Only names in the list will increase the kill counter. Only active when Id is used. (Default: all monsters)
#         <name>: <bool>   Monster name and whether the monster is added or removed from the list.
#   Drops:                 Quest item drop targets. (Default: null)
#     - Mob                Monster to kill. 0 will apply to all monsters. (Default: 0)
#       Item               Item to drop.
#       Count              Amount of items that will drop. Non-stackable items default to 1. (Default: 1)
#       Rate               Item drop rate. (10000 = 100%)
###########################################################################

Header:
  Type: QUEST_DB
  Version: 3

Body:
# ==========================================================
#  SafaRO - Todes-Debuff zuruecksetzen
# ----------------------------------------------------------
#  Nur die Jagd steht hier. Material und Bezahlung prueft der
#  NPC selbst.
#
#  Damit der Client die Quest anzeigen kann, braucht er einen
#  eigenen Eintrag in client/data/questid2display.txt. Ohne
#  den bricht QuestInfo_f.lub mit
#  "attempt to index field '?' (a nil value)" ab - die Tabelle
#  QuestInfoList wird vom Client aus dieser Textdatei gefuellt,
#  nicht aus einer Lua-Datei. Geprueft: von 520 Lua-Dateien in
#  der GRF nennt genau eine QuestInfoList, und die liest sie nur.
# ==========================================================
  - Id: 70251
    Title: Break the Cycle
    Targets:
      - Mob: ALARM
        Count: 300

# ==========================================================
#  SafaRO - Episode 22: The Hunt
# ----------------------------------------------------------
#  Die Kette des Grey Wolf Elder, npc/custom/safa_quests.txt.
#  Sechs Stufen von Level 20 bis 300.
#
#  ID-BEREICH
#
#  70260 bis 70265. Die hoechste amtliche Quest-Id in
#  db/re/quest_db.yml ist 62238 - nachgezaehlt, nicht
#  geschaetzt. Der 70er-Bereich ist damit frei, und 70251
#  liegt schon dort.
#
#  WARUM VIER DER SECHS UEBER "RACE" LAUFEN
#
#  Das Questsystem kann seit Version 3 auf Rasse und
#  Monsterlevel zaehlen statt auf einzelne Monsternamen
#  (Race, MinLevel). Damit zaehlt jedes Tier ab der
#  geforderten Stufe, egal wo es steht - der Spieler bekommt
#  keine Marschroute vorgeschrieben, sondern ein Ziel.
#  rAthena macht es bei seinen eigenen "Warrior Discipline"-
#  Quests genauso.
#
#  "Id: 1" ist dabei Pflicht: ohne diesen Index behandelt der
#  Parser den Eintrag als Monsterziel ohne Monster und
#  verwirft ihn.
#
#  ZWEI QUESTS HABEN ABSICHTLICH KEIN ZIEL
#
#  70263 und 70265 zaehlen erlegte Wildlife-Anfuehrer. Das
#  kann das Questsystem nicht - ein Wildlife ist kein eigener
#  Monstertyp, sondern ein aufgewertetes gewoehnliches Tier
#  (siehe npc/custom/safa_wildlife.txt). Gezaehlt wird deshalb
#  in der Charaktervariable wild_erlegt, und der Eintrag hier
#  dient nur dem Questfenster.
#
#  JEDE ID BRAUCHT AUSSERDEM eine Zeile in
#  client/data/questid2display.txt, sonst bricht der Client
#  beim Oeffnen des Questfensters ab. Steht dort.
# ==========================================================
  - Id: 70260
    Title: The First Track
    Targets:
      - Id: 1
        Count: 50
        Race: Brute
  - Id: 70261
    Title: The Hunt
    Targets:
      - Id: 1
        Count: 120
        Race: Brute
        MinLevel: 30
  - Id: 70262
    Title: Teeth and Claw
    Targets:
      - Id: 1
        Count: 200
        Race: Brute
        MinLevel: 70
  - Id: 70263
    Title: What Walks With Them
  - Id: 70264
    Title: The Grown Ones
    Targets:
      - Id: 1
        Count: 250
        Race: Brute
        MinLevel: 150
  - Id: 70265
    Title: The Chieftain's Due
