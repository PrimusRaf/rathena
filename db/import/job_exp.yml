# SafaRO - Erfahrungskurve fuer 4th- und 4th-Expanded-Klassen
#
# Erzeugt von tools/exp/kurve.py - nicht von Hand aendern, sondern
# dort die Stellschrauben drehen und neu erzeugen.
#
# Der Parser mischt je Stufe ein (pc.cpp: base_exp[level-1] = exp),
# deshalb stehen hier nur die Stufen ab 200 bzw. 1.
#
# VORGABE - gerechnet wurde in Kills, nicht in Erfahrungspunkten:
#
#     Basis 200 -> 275    1.500 Kills   (20.0 je Stufe)
#     Basis 275 -> 425    5.000 Kills   (33.3 je Stufe)
#     Basis 425 -> 500    7.500 Kills   (100.0 je Stufe)
#     Basis 200 -> 500 insgesamt 14.000 Kills
#
#   Job 150 ist bei etwa Basisstufe 425 voll (6.531 Kills).
#   Das sind 43 Kills je Job-Stufe, gleichmaessig verteilt -
#   ein Skillpunkt in stets gleichem Abstand, waehrend die
#   Basisstufen von 20 auf ueber 170 Kills anwachsen.
#
# MASSSTAB
#
#   Fuer jede Stufe das beste normale Monster, das dort erreichbar
#   ist - MVPs zaehlen nicht, die stehen nicht dauerhaft bereit.
#
#     Stufe 200:     11.687.550 Exp je Kill  (L Red Flame Spirit Lv262, Abzug 40 %)
#     Stufe 250:     37.984.537 Exp je Kill  (L Red Flame Spirit Lv262, Abzug 130 %)
#     Stufe 274:     26.296.987 Exp je Kill  (L Red Flame Spirit Lv262, Abzug 90 %)
#     Stufe 275:     29.218.875 Exp je Kill  (L Red Flame Spirit Lv262, Abzug 100 %)
#     Stufe 350:     29.218.875 Exp je Kill  (L Red Flame Spirit Lv262, Abzug 100 %)
#     Stufe 500:     29.218.875 Exp je Kill  (L Red Flame Spirit Lv262, Abzug 100 %)
#
#   Der Sprung bei 275 kommt vom Wegfall des Levelabzugs
#   (exp_penalty_maxlevel in conf/import/battle_conf.txt). Ohne ihn
#   gaebe es ab Stufe 296 nichts mehr ohne Abzug, denn das hoechste
#   normale Monster steht auf Stufe 279.

