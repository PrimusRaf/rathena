# ==========================================================================
#  SafaRO - Monster der Illusion-Karten, die rAthena nie eingebaut hat
# ==========================================================================
#
#  Illusion of Labyrinth (prt_mz03_i, Chaos-Monster 20525-20532) und
#  Abyss Lake 4 (abyss_04, Drachen 20612-20618) stehen als Karten in
#  maps_athena.conf und im Warper, die Monster dazu fehlen aber in
#  db/re/mob_db.yml komplett. Client-seitig ist alles da: npcidentity.lub,
#  jobname.lub und die Sprites in data.grf kennen alle 15 Nummern -
#  deshalb KEIN Client-Patch noetig.
#
#  Werte: divine-pride.net (kRO), Stand 2026-09-08.
#    Attack   = unterer Atk-Wert, Attack2 = unterer MAtk-Wert (Renewal)
#    WalkSpeed = 1000 / Zellen pro Sekunde
#    AttackDelay = 1000 / Angriffe pro Sekunde
#    Attack-/DamageMotion und Ai: vom Original-Monster (Baphomet Jr.,
#    Side Winder, Ferus, Acidus, Detale ...) uebernommen - divine-pride
#    zeigt diese Werte nicht.
#    Drops: Tabelle "default"; Rate in 1/10000 (2500 = 25 %).
#    Karten-gebundene Drops (Illusion Stone, Labyrinth Refine Box,
#    Illusion-Waffen) stehen in db/import/map_drops.yml.
#    Bone Detardeurus: divine-pride nennt keinen MvpExp - hier halbe
#    BaseExp angesetzt, wie bei den meisten MVPs dieser Stufe.
#  Skills: db/import/mob_skill_db.txt (vom jeweiligen Original kopiert).
#  Spawns: npc/custom/safa_altfelder.txt
# ==========================================================================

