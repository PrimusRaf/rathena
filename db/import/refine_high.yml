# SafaRO - Refine-Stufen 11 bis 30
#
# ERFOLGSRATEN
#   +11  50 %   +16  29 %   +21  20 %   +26  11 %
#   +12  45 %   +17  26 %   +22  18 %   +27   9 %
#   +13  40 %   +18  24 %   +23  16 %   +28   8 %
#   +14  35 %   +19  22 %   +24  15 %   +29   6 %
#   +15  32 %   +20  21 %   +25  13 %   +30   5 %
#
# Die offiziellen Werte lagen bei 8 % ab +11 und fielen auf 5 % - also
# flach und von Anfang an brutal. Diese Kurve faellt stattdessen
# gleichmaessig von 50 % auf 5 % und macht die unteren Stufen zu einer
# Formalitaet, die obersten zum eigentlichen Ziel.
#
# ALLE RATEN SIND VIELFACHE VON 100.
# getequippercentrefinery liefert im Skript "Rate / 100" als
# Ganzzahl - eine Rate von 90 waere dort 0 % geworden, der Versuch
# haette nie gelingen koennen und das Material waere trotzdem weg
# gewesen.
#
# Fuer 11-20 stehen hier NUR Type und Rate: der Parser mischt pro Feld
# ein, Preis, Material und Bruchrate bleiben also original. Wichtig ist
# das, weil die offiziellen Refiner-NPCs weiterhin zerstoeren duerfen -
# risikofrei ist nur der Weg ueber Ironhand, und der ruft schlicht
# kein failedrefitem auf.
#
# 21-30 sind neue Stufen und deshalb vollstaendig beschrieben.
# Braucht MAX_REFINE 30 in src/map/status.hpp.

