# SafaRO - Homunculus S bis Level 500
#
# Ergaenzt db/re/exp_homun.yml um die Stufen 275 bis 499.
#
# 500 fehlt bewusst: der Parser lehnt Level >= MAX_LEVEL ab. Der
# Eintrag fuer 499 ist der letzte, der gebraucht wird - er beziffert,
# was fuer den Sprung auf 500 noetig ist.
# Der normale Homunkulus bleibt bei Level 99 - diese Werte
# betreffen ausschliesslich den Homunculus S.
#
# Wachstum 0,4 % pro Stufe, also dieselbe Kurvenform wie die
# Basis-EXP des Besitzers. Das haelt das Verhaeltnis stabil:
# der Homunkulus braucht rund ein Zehntel dessen, was sein
# Besitzer fuer dieselbe Stufe braucht, und bekommt ueber
# homunculus_exp_gain 30 % davon ab. Er zieht also mit,
# statt irgendwann abgehaengt zu werden.
#
# Waere die offizielle Kurve (2 % pro Stufe) weitergelaufen,
# haette der Homunkulus auf Level 499 mehr EXP gebraucht als
# sein Besitzer - das Gegenteil des Gewuenschten.

