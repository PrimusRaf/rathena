###########################################################################
# Mob Item Ratio Database
###########################################################################
#
# Mob Item Ratio Settings
#
###########################################################################
# - Item          AegisName of item to adjust.
#   Ratio         Drop rate.
#   List:         List of monster(s) affected (format <Aegis monster name>: true/false). (Defaulted to all monsters)
###########################################################################

Header:
  Type: MOB_ITEM_RATIO_DB
  Version: 1

# ###########################################################################
# SafaRO
# ###########################################################################
#
# Ratio 100 heisst: fuer dieses Item wird der globale Drop-Multiplikator
# NICHT angewendet. Der Server ersetzt item_rate_common (bei uns 2500)
# durch 100, rechnet also Rate * 100 / 100 und laesst den Wert stehen.
#
# Ohne diesen Eintrag wuerden aus den 10 Prozent in
# db/import/mob_db_safa_coins.yml volle 100 Prozent, weil 1000 * 25
# ueber der Obergrenze von 10000 liegt.
#
# Leere List bedeutet: gilt fuer alle Monster.
# ###########################################################################

Body:
  - Item: Destiny_Coin
    Ratio: 100

  # Die Elephantmagon-Karte. Dieselbe Ueberlegung, andere Zahl:
  # conf/import/battle_conf.txt setzt item_rate_card auf 5000, also das
  # Fuenfzigfache. Aus den 0,5 Prozent in mob_db_safa_biom.yml wuerden
  # damit 25 - eine MVP-Karte, die jeder vierte Kill abwirft.
  #
  # mob.cpp:4830 ERSETZT den Typmultiplikator durch diesen Wert, es
  # rechnet ihn nicht dazu. Ratio 100 heisst also schlicht: Rate gilt,
  # wie sie dasteht.
  - Item: SAFA_ELEPHANTMAGON_CARD
    Ratio: 100

  # Gold und Truhe vom selben Boss - MIT List, und das ist der Punkt.
  #
  # Ohne List gilt ein Eintrag laut Dateikopf fuer ALLE Monster. Gold
  # faellt aber von zig amtlichen Monstern, und ein globaler Ratio 100
  # naehme ihnen allen den 25fachen Multiplikator aus
  # conf/import/battle_conf.txt - eine serverweite Aenderung, versteckt
  # in einer Zeile, die nach Biom aussieht.
  #
  # Warum ueberhaupt festnageln: Rate 3000 waeren mit dem Multiplikator
  # 75000 und wuerden auf item_drop_common_max = 10000 gekappt. Aus den
  # gewollten 30 Prozent wuerden 100, und in mob_db_safa_biom.yml
  # stuende eine Zahl, die nichts mehr bedeutet.
  - Item: Gold
    Ratio: 100
    List:
      SAFA_ELEPHANTMAGON: true
  - Item: Treasure_Box
    Ratio: 100
    List:
      SAFA_ELEPHANTMAGON: true
