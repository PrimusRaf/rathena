###########################################################################
# Mob Item Ratio Database
###########################################################################
#
# Mob Item Ratio Settings
#
###########################################################################
# - Item          AegisName of item to adjust.
#   Ratio         Drop rate.
#   List:         List of monster(s) affected (format <Aegis monster name>: true/false). (Defaulted to all monsters)
###########################################################################

Header:
  Type: MOB_ITEM_RATIO_DB
  Version: 1

# ###########################################################################
# SafaRO
# ###########################################################################
#
# Ratio 100 heisst: fuer dieses Item wird der globale Drop-Multiplikator
# NICHT angewendet. Der Server ersetzt item_rate_common (bei uns 2500)
# durch 100, rechnet also Rate * 100 / 100 und laesst den Wert stehen.
#
# Ohne diesen Eintrag wuerden aus den 10 Prozent in
# db/import/mob_db_safa_coins.yml volle 100 Prozent, weil 1000 * 25
# ueber der Obergrenze von 10000 liegt.
#
# Leere List bedeutet: gilt fuer alle Monster.
# ###########################################################################

Body:
  - Item: Destiny_Coin
    Ratio: 100
