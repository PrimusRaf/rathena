// --- SafaRO: PvP ---
// Der Duellmeister im Veins-Quartier und die Rueckweg-NPCs in den
// Arenen. Die Datei enthaelt AUSSERDEM Mapflag-Zeilen, und die sind
// der Grund, warum sie hier und nicht in npc/mapflag/ steht:
//
// npc/mapflag/nightmare.txt setzt pvp_nightmaredrop auf ALLEN 40
// pvp_n-Karten. Fuer die freie Arena und die Duellraeume muss das
// wieder weg, und das geht nur mit einer SPAETEREN Zeile.
// npc/re/scripts_main.conf liest scripts_mapflags.conf vor
// scripts_custom.conf - deshalb gewinnt diese Datei.
//
// Wird diese Reihenfolge je gedreht, verlieren Spieler in der freien
// Arena Ausruestung, ohne dass in safa_pvp.txt eine Zeile falsch
// waere. Steht dort im Kopf noch einmal ausfuehrlich.
//
// Die Rangliste liest pvp_kills, das safa_systems.txt hochzaehlt.
// Charaktervariablen werden beim Zugriff gelesen, nicht beim Laden -
// die Reihenfolge zu safa_systems.txt ist also gleichgueltig.
npc: npc/custom/safa_pvp.txt

// --- SafaRO: Die Gebundenen ---
// Vier private MVP-Kammern auf guild_vs1-1 bis 1-4, Eingang
// versteckt in thor_v03. Enthaelt ebenfalls Mapflag-Zeilen, aber
// anders als bei safa_pvp.txt ohne Konflikt: die vier Karten kommen
// in npc/mapflag/ ueberhaupt nicht vor. Die Reihenfolge in dieser
// Liste ist dafuer also gleichgueltig.
//
// Der Zustand der Mieten liegt in $@-Variablen mit dem Praefix
// $@safa_mvp - serverweit sichtbar. Wer ein weiteres Skript mit
// $@-Arrays dazustellt, gehoert an dieser Stelle gewarnt.
npc: npc/custom/safa_mvpraum.txt

// --- SafaRO: GM-Werkzeug @platz ---
// Verschiebt eigene NPCs im laufenden Spiel und merkt sich das ueber
// Neustarts hinweg.
//
// MUSS ALS LETZTE unserer Dateien stehen. Beim Serverstart wendet sie
// gespeicherte Verschiebungen ueber movenpc an, und movenpc findet nur
// NPCs, die schon geladen sind. Der Drei-Sekunden-Timer in der Datei
// faengt das zwar ohnehin ab - aber die Reihenfolge hier kostet nichts
// und ist die erste Verteidigungslinie.
//
// Erzeugt von tools/platzierer/bauen.py. Kommt ein NPC dazu oder zieht
// einer um, gehoert das Skript neu angeworfen, sonst kennt die Liste
// ihn nicht.
npc: npc/custom/safa_platzierer.txt
