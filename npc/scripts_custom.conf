// -- Auto-Potion command
// --- SafaRO: aktiviert ---
// Gibt Spielern @autopot. Das ist kein Widerspruch zu unserer Regel
// gegen Automatisierung, sondern deren Gegenstueck: wer ohnehin
// Heiltraenke im Sekundentakt klickt, hat damit keinen Grund mehr,
// ein Makro laufen zu lassen. Regeln durchzusetzen ist leichter,
// wenn man den Anlass wegnimmt.
//
// Rechte: das Skript bindet den Befehl mit bindatcmd(...,0,99), und
// gebundene Befehle werden ueber die GRUPPENSTUFE geprueft
// (atcommand.cpp:12053), nicht ueber die Befehlsliste in
// conf/import/groups.yml. Unsere Gruppe 0 hat Stufe 0, es ist dort
// also nichts nachzutragen.
npc: npc/custom/etc/autopot.txt

